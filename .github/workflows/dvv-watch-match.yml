name: DVV — Отслеживать матч(и)

on:
  workflow_dispatch:
    inputs:
      match_uuid:
        description: 'matchUuid матча. Можно несколько через запятую: uuid1,uuid2,uuid3'
        required: true
      poll_interval_seconds:
        description: 'Как часто опрашивать сайт, секунд'
        required: false
        default: '15'
      max_runtime_minutes:
        description: 'Страховка: максимум минут работы (не больше 350, лимит GitHub — 6 часов)'
        required: false
        default: '240'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Создать watchlist из входных параметров
        env:
          UUIDS: ${{ github.event.inputs.match_uuid }}
        run: |
          node -e "
          const list = process.env.UUIDS.split(',').map(s => s.trim()).filter(Boolean).map(u => ({ matchUuid: u }));
          require('fs').writeFileSync('dvv_watchlist.json', JSON.stringify(list));
          console.log('Матчей в списке:', list.length);
          "
          cat dvv_watchlist.json

      - name: Запустить мост
        env:
          DVV_POLL_INTERVAL_SEC: ${{ github.event.inputs.poll_interval_seconds }}
          DVV_MAX_RUNTIME_MIN: ${{ github.event.inputs.max_runtime_minutes }}
        run: node dvv_bridge.js
