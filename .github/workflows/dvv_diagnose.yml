name: DVV — Диагностика 403

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm install https-proxy-agent
      - env:
          DVV_PROXY: ${{ secrets.DVV_PROXY }}
        run: node dvv_diagnose.js
